function DLProgress(e){Percent=(Math.round(e.loaded / e.total * 100));window.msgs.innerHTML="Instalando Cache Offline: " + Percent + "%";}
function DisplayCacheProgress(){window.msgs.innerHTML="Cache Instalada Correctamente ✔";setTimeout(function(){window.msgs.innerHTML="Ahora Cierra y Vuelve Aabrir el Navegador ...";},1500);}

window.applicationCache.onupdateready=function(e){DisplayCacheProgress();};
window.applicationCache.onerror=function(e){window.msgs.innerHTML="Error al Instalar la Cache! - Limpia y Vuelve Abrir el Navegador ...";};
</script>
