<!DOCTYPE html>
<html manifest="css.manifest">
<head>
<title>PS4 KILA HACK</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<script>
history.replaceState(null,null,'index.html');var histlength=history.length;history.go(-histlength);
function DLProgress(e){Percent=(Math.round(e.loaded / e.total * 100));window.msgs.innerHTML="Instalando Cache Offline: " + Percent + "%";}
function DisplayCacheProgress(){window.msgs.innerHTML="Cache Instalado Correctamente ✔";setTimeout(function(){window.msgs.innerHTML="Ahora Cierra y Vuelve Abrir el Navegador ...";},1500);}
window.applicationCache.addEventListener("progress",DLProgress,false);
window.applicationCache.oncached=function(e){DisplayCacheProgress();};
window.applicationCache.onupdateready=function(e){DisplayCacheProgress();};
window.applicationCache.onerror=function(e){window.msgs.innerHTML="Error Al Instalar el Cache! - Limpia y Vuelve Abrir el Navegador ...";};
</script>
<h1>PS4 KILA HACK</h1>
<br>
<h1 id=msgs style="font-size: 30px;margin-top: 77px;margin-bottom: 455px;">Iniciando la Instalacion del Cache...</h1>
</body>
</html>
